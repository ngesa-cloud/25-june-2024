<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slow Burn</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9dfd2;--ember:#ff6a1a;--bg:#0b0507;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;font-family:Spectral,Georgia,serif;font-weight:300;color:var(--ink);pointer-events:none}
.ui p{margin:0;font-style:italic;font-size:15px;opacity:.7}
button{pointer-events:auto;font:inherit;font-size:16px;color:var(--ink);background:rgba(10,5,7,.6);border:1px solid rgba(233,223,210,.4);padding:10px 18px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity 1.2s}
button.show{opacity:1}
button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
h1{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:20px;margin:0;font:300 italic 22px Spectral,Georgia,serif;color:var(--ink);opacity:.8;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="c" aria-label="A cigarette burning slowly in front of a giant silhouette rising behind a wall"></canvas>
<h1>Slow burn</h1>
<!-- Navigation Anchors -->
<a href="index.html" style="position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); left:140px; color:rgba(233,223,210,0.6); font-size:12px; text-decoration:none; z-index:10; border:1px solid rgba(233,223,210,0.2); padding:3px 10px; border-radius:2px; background:rgba(11,5,7,0.5); backdrop-filter:blur(4px); font-family:sans-serif;">&larr; 25 June Platform</a>
<a href="vigil.html" style="position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); right:20px; color:rgba(233,223,210,0.6); font-size:12px; text-decoration:none; z-index:10; border:1px solid rgba(233,223,210,0.2); padding:3px 10px; border-radius:2px; background:rgba(11,5,7,0.5); backdrop-filter:blur(4px); font-family:sans-serif;">👁 Vigil Mode &rarr;</a>

<div class="ui"><p id="hint">Hold anywhere to take a drag.</p><button id="again">Light another</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const again=document.getElementById('again'),hint=document.getElementById('hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,wallTop,wallCanvas;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  wallTop=H*0.6;buildWall();
}
function buildWall(){
  wallCanvas=document.createElement('canvas');wallCanvas.width=W;wallCanvas.height=H-wallTop;
  const g=wallCanvas.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H-wallTop);gr.addColorStop(0,'#1c0f12');gr.addColorStop(1,'#070304');
  g.fillStyle=gr;g.fillRect(0,0,W,H-wallTop);
  g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1.5;
  const bh=26;let row=0;
  for(let y=0;y<H-wallTop;y+=bh,row++){
    g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
    const bw=64+(row%3)*6;
    for(let x=(row%2)*bw/2;x<W;x+=bw){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+bh);g.stroke();}
  }
  g.fillStyle='rgba(255,106,26,.18)';g.fillRect(0,0,W,3);
}
addEventListener('resize',resize);resize();

/* ---------- state ---------- */
let t=0,p=0,ash=8,puff=0,pressing=false,done=false;
const smoke=[],sparks=[],steam=[],chunks=[];
const scouts=Array.from({length:5},(_,i)=>({ph:i*1.3,sp:.35+i*.07,r:.9+i*.18,trail:[]}));
const BURN=200; // seconds for a full cigarette (slow), drag speeds it up
const PAPER=420,FILTER=110,R=16,ANG=-0.16;

addEventListener('pointerdown',()=>{pressing=true;hint.style.opacity=0});
addEventListener('pointerup',()=>pressing=false);
addEventListener('pointercancel',()=>pressing=false);
again.onclick=()=>{p=0;ash=8;done=false;again.classList.remove('show');hint.style.opacity=.7};

function tip(){
  const x=FILTER+PAPER*(1-p)+ash;
  const ox=W/2-(FILTER+PAPER*.5)*Math.cos(ANG)*(Math.min(1,W/760)),oy=H*0.8;
  return {ox,oy,x,wx:ox+x*Math.cos(ANG)*S(),wy:oy+x*Math.sin(ANG)*S()};
}
function S(){return Math.min(1,W/760)}

/* ---------- backdrop ---------- */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,wallTop);
  g.addColorStop(0,'#0b0507');g.addColorStop(.55,'#2a0f12');g.addColorStop(1,'#7a2f17');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function titanPos(){
  const cx=W*(W<700?.5:.66)+Math.sin(t*.12)*6;
  const size=Math.min(W,H)*.5;
  const rise=reduce?1:Math.min(1,.55+t/40);
  return {cx,size,top:wallTop-size*1.05*rise+Math.sin(t*.5)*3};
}
function drawSun(tp){
  const g=ctx.createRadialGradient(tp.cx,tp.top+tp.size*.35,10,tp.cx,tp.top+tp.size*.35,tp.size*1.8);
  g.addColorStop(0,'rgba(255,120,50,.85)');g.addColorStop(.25,'rgba(190,60,25,.45)');g.addColorStop(1,'rgba(40,10,12,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,wallTop+2);
}
function drawTitan(tp){
  const {cx,size}=tp,hw=size*.2,hh=size*.27,hy=tp.top+hh;
  ctx.save();
  ctx.fillStyle='#090305';ctx.shadowColor='rgba(255,110,40,.7)';ctx.shadowBlur=22;
  // shoulders & neck
  ctx.beginPath();
  ctx.moveTo(cx-size*.85,wallTop+4);
  ctx.bezierCurveTo(cx-size*.7,hy+hh*.8,cx-hw*1.4,hy+hh*1.05,cx-hw*.55,hy+hh*.9);
  ctx.lineTo(cx+hw*.55,hy+hh*.9);
  ctx.bezierCurveTo(cx+hw*1.4,hy+hh*1.05,cx+size*.7,hy+hh*.8,cx+size*.85,wallTop+4);
  ctx.closePath();ctx.fill();
  // head
  ctx.beginPath();ctx.ellipse(cx,hy,hw,hh,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // face: hollow eyes, fixed grin
  const eyeY=hy-hh*.1,pulse=.7+Math.sin(t*2)*.15;
  ctx.fillStyle=`rgba(255,190,120,${pulse})`;
  for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(cx+s*hw*.42,eyeY,hw*.13,hw*.07,s*.15,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle='rgba(255,170,110,.55)';ctx.lineWidth=2;
  const my=hy+hh*.5;
  ctx.beginPath();ctx.moveTo(cx-hw*.7,my-hh*.04);ctx.quadraticCurveTo(cx,my+hh*.22,cx+hw*.7,my-hh*.04);ctx.stroke();
  ctx.lineWidth=1.5;
  for(let i=-6;i<=6;i++){
    const x=cx+i*hw*.1,yy=my+Math.cos(i/6*1.4)*0+((1-Math.pow(i/6.5,2))*hh*.2)-hh*.04+Math.pow(i/6.5,2)*0;
    ctx.beginPath();ctx.moveTo(x,yy-hh*.07);ctx.lineTo(x,yy+hh*.05);ctx.stroke();
  }
  // steam
  if(!reduce&&Math.random()<.6)steam.push({x:cx+(Math.random()-.5)*hw*1.4,y:tp.top+hh*.3,vx:(Math.random()-.5)*.3,vy:-.5-Math.random()*.6,l:1,s:10+Math.random()*14});
  for(let i=steam.length-1;i>=0;i--){
    const s=steam[i];s.x+=s.vx;s.y+=s.vy;s.l-=.006;s.s+=.25;
    if(s.l<=0){steam.splice(i,1);continue}
    ctx.fillStyle=`rgba(255,200,170,${s.l*.12})`;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,7);ctx.fill();
  }
  return {hx:cx,hy:hy,hw,hh};
}
function drawScouts(tf){
  for(const s of scouts){
    const a=t*s.sp+s.ph,rr=tf.hh*(1.6+s.r*.9);
    const x=tf.hx+Math.cos(a)*rr*1.25,y=tf.hy+Math.sin(a*1.3)*rr*.55-tf.hh*.2;
    s.trail.push([x,y]);if(s.trail.length>26)s.trail.shift();
    ctx.lineWidth=1;ctx.strokeStyle='rgba(240,200,170,.22)';
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tf.hx+Math.cos(a+1.5)*tf.hw*.9,tf.hy+tf.hh*.55);ctx.stroke();
    ctx.beginPath();s.trail.forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));
    ctx.strokeStyle='rgba(255,200,150,.25)';ctx.stroke();
    ctx.fillStyle='#f3e3d0';ctx.fillRect(x-1.5,y-1.5,3,3);
  }
}

/* ---------- cigarette ---------- */
function drawCig(){
  const k=tip(),sc=S();
  ctx.save();ctx.translate(k.ox,k.oy);ctx.scale(sc,sc);ctx.rotate(ANG);
  const len=PAPER*(1-p),r=R;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,r+6,FILTER+len+ash,8);
  // filter
  let g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#e8a456');g.addColorStop(.5,'#c9822f');g.addColorStop(1,'#8a5214');
  ctx.fillStyle=g;rr(0,-r,FILTER,r*2,4);ctx.fill();
  ctx.strokeStyle='rgba(60,30,5,.4)';for(let x=8;x<FILTER;x+=7){ctx.beginPath();ctx.moveTo(x,-r+3);ctx.lineTo(x,r-3);ctx.stroke()}
  // paper
  g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#fbf6ee');g.addColorStop(.6,'#e5dccd');g.addColorStop(1,'#b7ab98');
  ctx.fillStyle=g;ctx.fillRect(FILTER,-r,len,r*2);
  // char ring
  const ex=FILTER+len;
  const cg=ctx.createLinearGradient(ex-26,0,ex,0);cg.addColorStop(0,'rgba(40,25,18,0)');cg.addColorStop(1,'rgba(30,14,8,.95)');
  ctx.fillStyle=cg;ctx.fillRect(ex-26,-r,26,r*2);
  // ash
  const ag=ctx.createLinearGradient(0,-r,0,r);ag.addColorStop(0,'#cfcac2');ag.addColorStop(1,'#6f6a65');
  ctx.fillStyle=ag;rr(ex,-r+1,ash,r*2-2,3);ctx.fill();
  ctx.strokeStyle='rgba(30,25,25,.35)';for(let x=ex+6;x<ex+ash;x+=9){ctx.beginPath();ctx.moveTo(x,-r+3);ctx.lineTo(x+3,r-3);ctx.stroke()}
  // ember glow at the tip
  const glow=.55+Math.sin(t*3.1)*.08+Math.sin(t*7.3)*.05+puff*.9;
  const eg=ctx.createRadialGradient(ex+ash,0,2,ex+ash,0,r*(2.8+puff*3));
  eg.addColorStop(0,`rgba(255,${150+puff*80|0},60,${Math.min(1,glow)})`);eg.addColorStop(.4,`rgba(255,80,20,${glow*.5})`);eg.addColorStop(1,'rgba(255,60,10,0)');
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=eg;ctx.fillRect(ex+ash-r*6,-r*6,r*12,r*12);
  const seam=ctx.createLinearGradient(ex-4,0,ex+8,0);seam.addColorStop(0,'rgba(255,90,20,0)');seam.addColorStop(.5,`rgba(255,120,40,${.6+puff*.4})`);seam.addColorStop(1,'rgba(255,90,20,0)');
  ctx.fillStyle=seam;ctx.fillRect(ex-4,-r,12,r*2);
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawParticles(k){
  // smoke
  const n=pressing?3:1;
  if(!done)for(let i=0;i<n;i++)if(Math.random()<(reduce?.2:.7))smoke.push({x:k.wx,y:k.wy-4,vx:(Math.random()-.5)*.25,vy:-.6-Math.random()*.4,l:1,s:4+Math.random()*4,sd:Math.random()*6});
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];s.l-=.0055;s.s+=.45;s.vy*=.998;
    s.x+=s.vx+Math.sin(t*.9+s.y*.015+s.sd)*.55;s.y+=s.vy;
    if(s.l<=0){smoke.splice(i,1);continue}
    const a=s.l*s.l*.16;
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.s);g.addColorStop(0,`rgba(220,210,205,${a})`);g.addColorStop(1,'rgba(220,210,205,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,7);ctx.fill();
  }
  // sparks
  if(!done&&Math.random()<(pressing?.5:.06))sparks.push({x:k.wx,y:k.wy,vx:(Math.random()-.5)*1.2,vy:-.5-Math.random()*1.2,l:1});
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.x+=s.vx+Math.sin(t*3+i)*.3;s.y+=s.vy;s.vy+=.008;s.l-=.012;
    if(s.l<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`rgba(255,${120+s.l*100|0},40,${s.l})`;ctx.fillRect(s.x,s.y,2,2);
  }
  // falling ash
  for(let i=chunks.length-1;i>=0;i--){
    const c=chunks[i];c.x+=c.vx;c.y+=c.vy;c.vy+=.12;c.a+=c.va;c.l-=.012;
    if(c.l<=0||c.y>H){chunks.splice(i,1);continue}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle=`rgba(150,145,140,${c.l})`;ctx.fillRect(-c.w/2,-3,c.w,6);ctx.restore();
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  puff+=((pressing&&!done?1:0)-puff)*.06;
  if(!done){
    p+=dt/BURN*(1+puff*5);
    ash+=dt*(2.2+puff*8);
    if(ash>44){
      const k=tip();
      for(let i=0;i<4;i++)chunks.push({x:k.wx-ash*.5*S()+i*8,y:k.wy,vx:(Math.random()-.3)*1.2,vy:-1,a:0,va:(Math.random()-.5)*.2,w:12+Math.random()*10,l:1});
      ash=6;
    }
    if(p>=1){p=1;done=true;again.classList.add('show')}
  }
  drawSky();const tp=titanPos();drawSun(tp);
  const tf=drawTitan(tp);drawScouts(tf);
  ctx.drawImage(wallCanvas,0,wallTop);
  const vg=ctx.createRadialGradient(W/2,H*.7,H*.2,W/2,H*.7,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.65)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawCig();drawParticles(tip());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
